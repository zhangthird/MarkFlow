name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # package-lock.json is currently slightly behind package.json and
      # Excalidraw 0.18 brings older React peer ranges. npm install lets CI
      # validate the actual dependency graph while we keep the compatibility
      # warning visible instead of skipping validation entirely.
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
