name: Privacy history rewrite

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  rewrite-history:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite exposed author metadata and force-push branches
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags
          git checkout -B main origin/main

          BRANCHES=(main)
          if git show-ref --verify --quiet refs/remotes/origin/chatgpt/markflow-quality-tests; then
            git branch -f chatgpt/markflow-quality-tests origin/chatgpt/markflow-quality-tests
            BRANCHES+=(chatgpt/markflow-quality-tests)
          fi

          export FILTER_BRANCH_SQUELCH_WARNING=1
          git filter-branch --force --env-filter '
            OLD_EMAIL="icuicheng@foxmail.com"
            NEW_NAME="zhangthird"
            NEW_EMAIL="95128620+zhangthird@users.noreply.github.com"

            if [ "$GIT_AUTHOR_EMAIL" = "$OLD_EMAIL" ]; then
              export GIT_AUTHOR_NAME="$NEW_NAME"
              export GIT_AUTHOR_EMAIL="$NEW_EMAIL"
            fi

            if [ "$GIT_COMMITTER_EMAIL" = "$OLD_EMAIL" ]; then
              export GIT_COMMITTER_NAME="$NEW_NAME"
              export GIT_COMMITTER_EMAIL="$NEW_EMAIL"
            fi
          ' -- "${BRANCHES[@]}"

          git push --force origin main:main
          if printf '%s\n' "${BRANCHES[@]}" | grep -qx 'chatgpt/markflow-quality-tests'; then
            git push --force origin chatgpt/markflow-quality-tests:chatgpt/markflow-quality-tests
          fi
